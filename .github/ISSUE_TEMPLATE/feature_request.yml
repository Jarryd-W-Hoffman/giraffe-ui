name: Component or feature request
description: Suggest a new component or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe the UI and where it's used. Screenshots or links to similar components help.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: How would you like to use it?
      description: The Blade you'd like to write.
      render: blade
