name: Release

# Push a tag like v0.1.0 to publish a GitHub release with that version's CHANGELOG section as its notes.
# Packagist picks up new tags on its own once the GitHub webhook is set up (see RELEASING.md).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between "## [version]" and the next "## [" heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]."
            exit 1
          fi

          if grep -q "^## \[$version\] - Unreleased" CHANGELOG.md; then
            echo "::error::[$version] in CHANGELOG.md is still marked Unreleased. Set its date before tagging."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $([[ "$GITHUB_REF_NAME" == v0.* ]] && echo --prerelease)
