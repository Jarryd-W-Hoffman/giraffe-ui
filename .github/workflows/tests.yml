name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} (${{ matrix.stability }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        stability: [prefer-lowest, prefer-stable]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  lint:
    name: Pint and docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test

      - name: Component docs are up to date
        run: |
          composer docs
          git diff --exit-code docs || (echo "::error::docs/components is out of date. Run composer docs and commit the result." && exit 1)

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

      # Fails on known vulnerabilities in the dependencies a fresh install resolves.
      - run: composer audit

  css:
    name: Tailwind finds every class
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: giraffeui

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build CSS the way an app would
        run: |
          mkdir -p app/resources/css app/vendor/jayaitch
          ln -s "$GITHUB_WORKSPACE/giraffeui" app/vendor/jayaitch/giraffeui
          cd app
          npm init -y > /dev/null
          npm install tailwindcss@4 @tailwindcss/cli@4
          printf '@import "tailwindcss";\n@import "../../vendor/jayaitch/giraffeui/resources/css/giraffeui.css";\n' > resources/css/app.css
          npx @tailwindcss/cli -i resources/css/app.css -o out.css

      - name: Check component classes were generated
        working-directory: app
        run: |
          status=0
          # Fixed-string matches on the escaped selectors Tailwind writes, e.g. .hover\:bg-gui-success\/10
          for class in 'bg-gui-primary' 'bg-gui-danger' 'border-gui-warning-text' 'text-gui-info-foreground' 'hover\:bg-gui-success\/10' 'rounded-gui' 'divide-zinc-200' 'border-gui-input' '\[position-area\:bottom_span-right\]' 'group-has-focus-visible\/tooltip\:visible'; do
            if ! grep -qF ".$class" out.css; then
              echo "::error::.$class is missing from the compiled CSS"
              status=1
            fi
          done
          exit $status

  accessibility:
    name: Accessibility and behaviour (with Livewire)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: composer install --no-interaction --prefer-dist
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run catalog:css

      - name: Start the catalog
        run: |
          vendor/bin/testbench serve --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/catalog/introduction && exit 0; sleep 1; done
          cat serve.log
          exit 1

      - run: npm run audit:a11y
      - run: npm run test:browser

      - name: Behaviour in Firefox
        run: |
          npx playwright install --with-deps firefox
          BROWSER=firefox npm run test:browser

      # WebKit is the engine behind Safari, so this is Safari's coverage.
      - name: Behaviour and accessibility in WebKit (Safari)
        run: |
          npx playwright install --with-deps webkit
          BROWSER=webkit npm run test:browser
          BROWSER=webkit npm run audit:a11y

  without-livewire:
    name: Without optional packages (no Livewire, no blade-icons)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Livewire and blade-icons are only dev dependencies. Remove them to prove the components need nothing but
      # Alpine, and that the Icon component explains what to install.
      - run: composer install --no-interaction --prefer-dist
      - run: composer remove --dev livewire/livewire blade-ui-kit/blade-heroicons --no-interaction

      - name: Run the tests that don't need them
        run: vendor/bin/pest --exclude-group=livewire --exclude-group=blade-icons

      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run catalog:css

      - name: Start the catalog
        run: |
          vendor/bin/testbench serve --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/catalog/introduction && exit 0; sleep 1; done
          cat serve.log
          exit 1

      - name: Alpine is loaded on its own
        run: curl -sf http://127.0.0.1:8000/catalog/introduction | grep -q 'src="/catalog/assets/alpine.js"'

      - run: npm run test:browser
      - run: npm run audit:a11y
