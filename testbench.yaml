laravel: '@testbench'

# Livewire is registered by WorkbenchServiceProvider when it's installed; CI also runs the catalog without it.
providers:
  - JayAitch\GiraffeUI\GiraffeUIServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

# WorkbenchServiceProvider also forces file cache and sessions, because the served app reads the generated
# skeleton .env, which can say otherwise.
env:
  # A fixed key for the local catalog only. It protects nothing real.
  - APP_KEY=base64:R2lyYWZmZVVJIGNhdGFsb2cga2V5LCBub3QgcmVhbCE=
  - CACHE_STORE=file
  - SESSION_DRIVER=file

workbench:
  start: '/catalog'
